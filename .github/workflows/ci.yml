name: Integracion Continua Mate

# El workflow arranca cada vez que hago un push a main o hago un pull request.
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-y-test:
    # GitHub nos presta una maquina virtual Linux.
    runs-on: ubuntu-latest

    steps:
    - name: Paso 1 - Clonar el codigo
      uses: actions/checkout@v4

    - name: Paso 2 - Preparar Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Paso 3 - Instalar dependencias
      run: pip install -r requirements.txt

    - name: Paso 4 - Ejecutar prueba automatizada
      run: python -m unittest test_mate.py

    - name: Paso 5 - Inspeccion estatica de codigo con Ruff
      run: ruff check .

    - name: Paso 6 - Empaquetar la aplicacion con Docker
      run: docker build -t app-mate-flask .

    - name: Mecanismo de Feedback - Notificar en Slack
      uses: 8398a7/action-slack@v3
      with:
        status: ${{ job.status }}
        fields: repo,message,commit,author,status
      env:
        # Esto lee un link secreto guardado en la configuracion de GitHub.
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
      # Manda el mensaje siempre, incluso si un paso anterior fallo.
      if: always()
